- name: Stop and disable legacy remote-access services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - telnet.socket
    - rsh.socket
    - rlogin.socket
    - tftp.socket
    - vsftpd
    - xinetd
  failed_when: false
  when: not (skip_service_restart | default(false))
  tags: [services.legacy, services]
