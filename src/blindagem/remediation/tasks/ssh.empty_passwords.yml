- name: Reject SSH logins with empty passwords
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config.d/10-blindagem.conf
    regexp: '^\s*PermitEmptyPasswords\b'
    line: PermitEmptyPasswords no
    create: true
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart ssh
  tags: [ssh.empty_passwords, ssh]
