- name: Require SSH keys instead of passwords
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config.d/10-blindagem.conf
    regexp: '^\s*PasswordAuthentication\b'
    line: PasswordAuthentication no
    create: true
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh
  tags: [ssh.password_auth, ssh]
