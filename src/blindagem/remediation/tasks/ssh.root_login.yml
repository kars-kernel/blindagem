- name: Ensure sshd reads the drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    state: present
  tags: [ssh.root_login, ssh]

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config.d/10-blindagem.conf
    regexp: '^\s*PermitRootLogin\b'
    line: PermitRootLogin no
    create: true
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart ssh
  tags: [ssh.root_login, ssh]
